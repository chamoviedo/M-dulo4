<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Estudos de iframe </title>
    <style>
        iframe {
            width: 400;
            height: 300;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <!--tamanho padrão do iframe 300x150-->
    <h1> Testando  o uso de iframe .</h1>
    <p>  Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="300" scolling="auto">
            <!--scolling pode ser yes, no ou auto-->
            <a href="https://www.cursoemvideo.com" target="_blank">cursoemvideo </a>
        </iframe>
        para aprender a programar .</p>
        <!-- Aiframe é um quadro em linha -->
        <p> o repoditório do guanabara
            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500" scolling="no">
                <a href="https://gustavoguanabara.github.io"></a>
            </iframe>
            também é legal !</p>
</body>
</html>
